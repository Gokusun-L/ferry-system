<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: content(~{::body})}">
<body>
<div id="pageContent">
    <div class="card">
        <h3>用户管理</h3>
        <div class="toolbar">
            <div class="form-group"><input type="text" id="searchUsername" placeholder="用户名"></div>
            <div class="form-group">
                <select id="searchRole">
                    <option value="">全部角色</option>
                    <option value="ADMIN">管理员</option>
                    <option value="SELLER">售票员</option>
                    <option value="PASSENGER">乘客</option>
                </select>
            </div>
            <div class="form-group"><input type="text" id="searchName" placeholder="姓名"></div>
            <button class="btn btn-primary" onclick="loadUsers(1)">搜索</button>
            <button class="btn btn-success" onclick="openCreate()">新增用户</button>
        </div>
        <table>
            <thead>
            <tr><th>ID</th><th>用户名</th><th>姓名</th><th>手机号</th><th>角色</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="userTbody"></tbody>
        </table>
        <div class="pagination" id="userPagination"></div>
    </div>
</div>

<div class="modal-mask" id="createModal">
    <div class="modal">
        <h3>新增用户</h3>
        <div class="form-group"><label>用户名</label><input type="text" id="cUsername"></div>
        <div class="form-group"><label>密码</label><input type="text" id="cPassword"></div>
        <div class="form-group"><label>姓名</label><input type="text" id="cName"></div>
        <div class="form-group"><label>手机号</label><input type="text" id="cPhone"></div>
        <div class="form-group">
            <label>角色</label>
            <select id="cRole"><option value="SELLER">售票员</option><option value="ADMIN">管理员</option></select>
        </div>
        <button class="btn btn-primary" onclick="doCreate()">确定</button>
        <button class="btn" onclick="closeModal('createModal')">取消</button>
    </div>
</div>

<div class="modal-mask" id="editModal">
    <div class="modal">
        <h3>编辑用户</h3>
        <input type="hidden" id="eId">
        <div class="form-group"><label>用户名</label><input type="text" id="eUsername" disabled></div>
        <div class="form-group"><label>姓名</label><input type="text" id="eName"></div>
        <div class="form-group"><label>手机号</label><input type="text" id="ePhone"></div>
        <div class="form-group"><label>身份证号</label><input type="text" id="eIdCard" maxlength="18"></div>
        <div class="form-group">
            <label>角色</label>
            <select id="eRole">
                <option value="PASSENGER">乘客</option>
                <option value="SELLER">售票员</option>
                <option value="ADMIN">管理员</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="doEdit()">保存</button>
        <button class="btn" onclick="closeModal('editModal')">取消</button>
    </div>
</div>

<script class="page-script">
var page = 1, size = 10;
var usersCache = [];
function loadUsers(p) {
    page = p || 1;
    var params = new URLSearchParams({
        page: page, size: size,
        username: document.getElementById('searchUsername').value,
        role: document.getElementById('searchRole').value,
        name: document.getElementById('searchName').value
    });
    fetch('/api/users?' + params).then(r => r.json()).then(res => {
        usersCache = res.data.list;
        var html = '';
        res.data.list.forEach(u => {
            html += '<tr><td>' + u.id + '</td><td>' + u.username + '</td><td>' + u.name + '</td><td>' + u.phone + '</td>' +
                '<td>' + roleText(u.role) + '</td>' +
                '<td>' + (u.status === 1 ? '<span class="text-success">启用</span>' : '<span class="text-danger">禁用</span>') + '</td>' +
                '<td>' +
                '<button class="btn btn-sm btn-primary" onclick="openEdit(' + u.id + ')">编辑</button> ' +
                '<button class="btn btn-sm btn-warning" onclick="resetPwd(' + u.id + ')">重置密码</button> ' +
                '<button class="btn btn-sm ' + (u.status === 1 ? 'btn-danger' : 'btn-success') + '" onclick="toggleStatus(' + u.id + ')">' + (u.status === 1 ? '禁用' : '启用') + '</button>' +
                '</td></tr>';
        });
        document.getElementById('userTbody').innerHTML = html;
        renderPagination('userPagination', page, res.data.total, size, loadUsers);
    });
}
function openCreate() { document.getElementById('createModal').classList.add('show'); }
function openEdit(id) {
    var u = usersCache.find(x => x.id === id);
    if (!u) { alert('用户信息已过期，请刷新列表'); return; }
    document.getElementById('eId').value = u.id;
    document.getElementById('eUsername').value = u.username;
    document.getElementById('eName').value = u.name || '';
    document.getElementById('ePhone').value = u.phone || '';
    document.getElementById('eIdCard').value = u.idCard || '';
    document.getElementById('eRole').value = u.role;
    document.getElementById('editModal').classList.add('show');
}
function doEdit() {
    var id = document.getElementById('eId').value;
    var body = {
        name: document.getElementById('eName').value.trim(),
        phone: document.getElementById('ePhone').value.trim(),
        idCard: document.getElementById('eIdCard').value.trim(),
        role: document.getElementById('eRole').value
    };
    if (!body.name) { alert('姓名不能为空'); return; }
    api('/api/users/' + id, 'PUT', body).then(res => {
        if (res.code === 0) { closeModal('editModal'); loadUsers(page); }
        else alert(res.msg);
    });
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function doCreate() {
    var body = {
        username: document.getElementById('cUsername').value,
        password: document.getElementById('cPassword').value,
        name: document.getElementById('cName').value,
        phone: document.getElementById('cPhone').value,
        role: document.getElementById('cRole').value
    };
    api('/api/users', 'POST', body).then(res => {
        if (res.code === 0) { closeModal('createModal'); loadUsers(page); }
        else alert(res.msg);
    });
}
function resetPwd(id) {
    var pwd = prompt('输入新密码（至少6位）：');
    if (!pwd) return;
    api('/api/users/' + id + '/password', 'PUT', {password: pwd}).then(res => {
        alert(res.code === 0 ? '重置成功' : res.msg);
    });
}
function toggleStatus(id) {
    api('/api/users/' + id + '/status', 'PUT').then(res => {
        if (res.code === 0) loadUsers(page); else alert(res.msg);
    });
}
loadUsers(1);
</script>
</body>
</html>
