<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: content(~{::body})}">
<body>
<div id="pageContent">
    <div class="card">
        <div class="card-head">
            <div class="icon-chip">👤</div>
            <div class="head-text">
                <h3>个人中心</h3>
                <p class="card-desc">查看与修改个人资料信息</p>
            </div>
        </div>
        <div class="form-group"><label>用户名</label><input type="text" th:value="${user.username}" disabled></div>
        <div class="form-group"><label>姓名</label><input type="text" id="pName" th:value="${user.name}"></div>
        <div class="form-group"><label>手机号</label><input type="text" id="pPhone" th:value="${user.phone}"></div>
        <div class="form-group"><label>身份证号</label><input type="text" id="pIdCard" th:value="${user.idCard}"></div>
        <div class="form-group"><label>角色</label><input type="text" th:value="${user.role == 'ADMIN' ? '管理员' : (user.role == 'SELLER' ? '售票员' : '乘客')}" disabled></div>
        <button class="btn btn-primary" onclick="saveProfile()">保存信息</button>
    </div>

    <div class="card">
        <div class="card-head">
            <div class="icon-chip">🔒</div>
            <div class="head-text">
                <h3>修改密码</h3>
                <p class="card-desc">定期更新密码，保障账户安全</p>
            </div>
        </div>
        <div class="form-group"><label>原密码</label><input type="password" id="oldPwd"></div>
        <div class="form-group"><label>新密码</label><input type="password" id="newPwd"></div>
        <button class="btn btn-primary" onclick="changePwd()">修改密码</button>
    </div>
</div>

<script class="page-script">
function saveProfile() {
    var body = {
        name: document.getElementById('pName').value,
        phone: document.getElementById('pPhone').value,
        idCard: document.getElementById('pIdCard').value
    };
    api('/api/profile', 'PUT', body).then(res => {
        alert(res.code === 0 ? '保存成功' : res.msg);
        if (res.code === 0) location.reload();
    });
}
function changePwd() {
    var body = {oldPassword: document.getElementById('oldPwd').value, newPassword: document.getElementById('newPwd').value};
    api('/api/profile/password', 'PUT', body).then(res => {
        if (res.code === 0) { alert('修改成功，请重新登录'); logout(); }
        else alert(res.msg);
    });
}
</script>
</body>
</html>
