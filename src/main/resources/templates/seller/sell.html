<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: content(~{::body})}">
<body>
<div id="pageContent">
    <div class="card">
        <h3>线下售票</h3>
        <div class="toolbar">
            <div class="form-group"><select id="sRouteId"><option value="">全部航线</option></select></div>
            <div class="form-group"><input type="date" id="sDate"></div>
            <button class="btn btn-primary" onclick="loadSchedules()">查询班次</button>
        </div>
        <table>
            <thead><tr><th>班次</th><th>航线</th><th>船舶</th><th>发船时间</th><th>票价</th><th>余票</th><th>操作</th></tr></thead>
            <tbody id="scheduleTbody"></tbody>
        </table>
    </div>
</div>

<div class="modal-mask" id="sellModal">
    <div class="modal">
        <h3>代乘客购票</h3>
        <input type="hidden" id="mScheduleId">
        <div class="form-group"><label>乘客姓名</label><input type="text" id="mName"></div>
        <div class="form-group"><label>身份证号</label><input type="text" id="mIdCard"></div>
        <div class="form-group"><label>手机号</label><input type="text" id="mPhone"></div>
        <div class="form-group"><label>选择座位</label><div id="seatMap" class="seat-map"></div></div>
        <button class="btn btn-primary" onclick="doSell()">确认购票</button>
        <button class="btn" onclick="closeModal('sellModal')">取消</button>
    </div>
</div>

<div class="modal-mask" id="ticketModal">
    <div class="modal">
        <h3>船票（打印预览）</h3>
        <div id="ticketContent" style="border:2px dashed #333;padding:20px;text-align:center;"></div>
        <button class="btn btn-primary" onclick="window.print()">打印</button>
        <button class="btn" onclick="closeModal('ticketModal')">关闭</button>
    </div>
</div>

<script class="page-script">
var selectedSeat = null;
function loadOptions() {
    api('/api/routes/all').then(res => {
        var html = '<option value="">全部航线</option>';
        res.data.forEach(r => { html += '<option value="' + r.id + '">' + r.routeName + '</option>'; });
        document.getElementById('sRouteId').innerHTML = html;
    });
}
function loadSchedules() {
    var routeId = document.getElementById('sRouteId').value;
    var date = document.getElementById('sDate').value;
    api('/api/schedules?page=1&size=100&routeId=' + (routeId || '') + '&date=' + (date || '') + '&status=SELLING').then(res => {
        var html = '';
        res.data.list.forEach(s => {
            html += '<tr><td>' + s.id + '</td><td>' + s.routeName + '</td><td>' + s.shipName + '</td>' +
                '<td>' + s.departTime + '</td><td>¥' + s.price + '</td><td>' + s.remainingSeats + '</td>' +
                '<td><button class="btn btn-sm btn-primary" onclick="openSell(' + s.id + ')">售票</button></td></tr>';
        });
        document.getElementById('scheduleTbody').innerHTML = html;
    });
}
function openSell(scheduleId) {
    selectedSeat = null;
    document.getElementById('mScheduleId').value = scheduleId;
    document.getElementById('mName').value = '';
    document.getElementById('mIdCard').value = '';
    document.getElementById('mPhone').value = '';
    loadSeats(scheduleId);
    document.getElementById('sellModal').classList.add('show');
}
function loadSeats(scheduleId) {
    api('/api/schedules/' + scheduleId + '/seat-map').then(res => {
        var seats = (res.data || []).slice().sort((a, b) => {
            var ra = parseInt(a.seatNo), rb = parseInt(b.seatNo);
            if (ra !== rb) return ra - rb;
            return a.seatNo.localeCompare(b.seatNo);
        });
        var html = '';
        seats.forEach(s => {
            var cls = s.status === 'SOLD' ? 'sold' : (s.status === 'LOCKED' ? 'locked' : 'available');
            var click = (s.status === 'AVAILABLE' && s.seatNo !== selectedSeat)
                ? ' onclick="selectSeat(\'' + s.seatNo + '\')"' : '';
            html += '<div class="seat ' + cls + '" data-seat="' + s.seatNo + '"' + click + '>' + s.seatNo + '</div>';
        });
        document.getElementById('seatMap').innerHTML = html;
    });
}
function selectSeat(seatNo) {
    var scheduleId = document.getElementById('mScheduleId').value;
    // 选中新座位前释放上一个锁定
    if (selectedSeat && selectedSeat !== seatNo) {
        api('/api/seats/unlock', 'POST', {scheduleId: scheduleId, seatNos: [selectedSeat]});
    }
    api('/api/seats/lock', 'POST', {scheduleId: scheduleId, seatNos: [seatNo]}).then(res => {
        if (res.code !== 0) { alert(res.msg); loadSeats(scheduleId); return; }
        selectedSeat = seatNo;
        document.querySelectorAll('.seat').forEach(el => {
            if (el.dataset.seat === seatNo) el.classList.add('selected');
            else el.classList.remove('selected');
        });
    });
}
function doSell() {
    var scheduleId = document.getElementById('mScheduleId').value;
    var name = document.getElementById('mName').value;
    var idCard = document.getElementById('mIdCard').value;
    var phone = document.getElementById('mPhone').value;
    if (!name || !idCard || !selectedSeat) { alert('请填写完整信息并选择座位'); return; }
    if (!confirm('确认售票：座位 ' + selectedSeat + '，乘客 ' + name + '？')) return;
    var body = {
        scheduleId: scheduleId,
        tickets: [{seatNo: selectedSeat, passengerName: name, idCard: idCard, phone: phone}]
    };
    api('/api/orders', 'POST', body).then(res => {
        if (res.code !== 0) { alert(res.msg); return; }
        var order = res.data;
        // 线下售票直接支付
        api('/api/orders/' + order.id + '/pay', 'POST').then(r2 => {
            if (r2.code === 0) {
                closeModal('sellModal');
                // 查询联表详情，保证打印信息完整
                api('/api/orders/' + order.id).then(d => {
                    showTicket(d.code === 0 ? d.data.order : order, name, idCard, selectedSeat);
                });
                loadSchedules();
            } else alert(r2.msg);
        });
    });
}
function showTicket(order, name, idCard, seatNo) {
    var html = '<h3 style="margin-bottom:10px;">⛴️ 船票</h3>' +
        '<p style="font-size:20px;">' + (order.routeName || '') + '</p>' +
        '<p>乘客：' + name + '</p><p>身份证：' + idCard + '</p>' +
        '<p>座位：' + seatNo + '</p><p>订单号：' + order.orderNo + '</p>' +
        '<p style="font-size:24px;">' + (order.departTime || '') + '</p>' +
        '<div style="margin-top:10px;">[ 二维码占位 ]</div>';
    document.getElementById('ticketContent').innerHTML = html;
    document.getElementById('ticketModal').classList.add('show');
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
loadOptions();
loadSchedules();
</script>
</body>
</html>
